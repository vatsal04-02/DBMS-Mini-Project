spring.application.name=hotel-backend

server.port=${PORT:8080}

# Local default: embedded H2 (no Postgres required).
# For Postgres, set DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD, DATABASE_DRIVER=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:hoteldb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# schema.sql / data.sql run automatically for embedded databases
spring.sql.init.mode=embedded
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
